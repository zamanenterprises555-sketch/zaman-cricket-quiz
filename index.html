<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Cricket Quiz PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #1b5e20;
            --secondary: #2e7d32;
            --accent: #ff9800;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .scoreboard {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid var(--secondary);
        }
        .hidden {
            display: none !important;
        }
        .question-box {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .timer {
            color: #d32f2f;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

    <header>🏏 Zaman Cricket Quiz</header>

    <div class="container" id="setup-screen">
        <h2>Game Setup</h2>
        <label>Player Name:</label>
        <input type="text" id="player-name" placeholder="আপনার പേര് നൽകുക">
        
        <label>Team Size (Batting/Bowling):</label>
        <select id="team-size">
            <option value="1">Single Player (Solo)</option>
            <option value="2">2 vs 2</option>
            <option value="3">3 vs 3</option>
            <option value="4">4 vs 4</option>
        </select>

        <button onclick="startGame()">Start / Join Room</button>
    </div>

    <div class="container hidden" id="game-screen">
        <div class="scoreboard" id="scoreboard-display">
            <!-- Score & Match Stats -->
        </div>

        <div class="question-box" id="question-container">
            <span class="timer" id="timer-display">⏱ 10s</span>
            <p id="question-text">ചോദ്യം ഇവിടെ വരു...</p>
            <div id="options-container"></div>
        </div>
    </div>

    <script>
        // Comprehensive Question Bank based on Mobile Repairing Manual & Electronics Data
        const questionBank = [
            // Overs 1-6: MCQ & Symbol ID
            { overMin: 1, overMax: 6, type: 'mcq', q: "താഴെ നൽകിയിരിക്കുന്ന യൂറോപ്യൻ/അമേരിക്കൻ രീതിയിലുള്ള സിംബൽ ഏത് കമ്പോണന്റിന്റേതാണ്?", options: ["കപ്പാസിറ്റർ", "റെസിസ്റ്റർ (Resistor)", "ഡയോഡ്", "കോയിൽ"], ans: 1 },
            { overMin: 1, overMax: 6, type: 'mcq', q: "മൾട്ടിമീറ്റർ ബീപ് മോഡിൽ വെച്ച് പരിശോധിക്കുമ്പോൾ '000' കാണിച്ച് ബീപ് സൗണ്ട് കേൾപ്പിക്കുന്നതും AC ബ്ലോക്ക് ചെയ്യുന്നതുമായ കമ്പോണന്റ് ഏത്?", options: ["കോയിൽ (Inductor)", "റെസിസ്റ്റർ", "സെനർ ഡയോഡ്", "കപ്പാസിറ്റർ"], ans: 0 },
            { overMin: 1, overMax: 6, type: 'mcq', q: "10000 ഓമിന്റെ (10K) റെസിസ്റ്റർ മൾട്ടിമീറ്റർ ഉപയോഗിച്ച് ചെക്ക് ചെയ്യാൻ ഏത് റേഞ്ച് ആണ് സെലക്ട് ചെയ്യേണ്ടത്?", options: ["200Ω", "2K", "20K", "2M"], ans: 2 },
            { overMin: 1, overMax: 6, type: 'mcq', q: "ഫോൺ വിളിക്കുമ്പോൾ ചെവിയോട് അടുപ്പിക്കുമ്പോൾ ബാക്ക് ലൈറ്റ് ഓഫ് ചെയ്യാൻ സഹായിക്കുന്ന സെൻസർ ഏത്?", options: ["ഫേസ് ഐഡി", "പ്രോക്സിമിറ്റി സെൻസർ (Proximity Sensor)", "ഗൈറോസ്കോപ്പ്", "ബാരോമീറ്റർ"], ans: 1 },
            { overMin: 1, overMax: 6, type: 'mcq', q: "റെഗുലർ ഡയോഡിന്റെ മുകളിൽ കാണുന്ന വൈറ്റ് ഷെയ്ഡ് ഏത് ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്?", options: ["ആനോഡ് (+ve)", "കാഥോഡ് (Cathode / -ve)", "ബേസ്", "എമിറ്റർ"], ans: 1 },
            { overMin: 1, overMax: 6, type: 'mcq', q: "360 ഡിഗ്രി വൃത്താകൃതിയിലുള്ള ചലനങ്ങളെ സെൻസ് ചെയ്ത് ഗെയിമിംഗിനും മറ്റും ഉപയോഗിക്കുന്ന സെൻസർ ഏത്?", options: ["ആക്സിലറോമീറ്റർ", "ഗൈറോസ്കോപ്പ് (Gyroscope)", "മാഗ്നെറ്റോമീറ്റർ", "സോളി സെൻസർ"], ans: 1 },

            // Overs 6-10: One-word answers
            { overMin: 6, overMax: 10, type: 'one-word', q: "ആറ്റത്തിലെ നെഗറ്റീവ് ചാർജുള്ള ഇലക്ട്രോൺസ് ചലിക്കുമ്പോൾ ഉണ്ടാകുന്ന പ്രതിഭാസം എന്താണ്?", ans: "കറന്റ്" },
            { overMin: 6, overMax: 10, type: 'one-word', q: "കപ്പാസിറ്റർ നല്ലതാണോ എന്ന് ഡിസി വോൾട്ടേജ് റേഞ്ചിൽ വെച്ച് നോക്കുമ്പോൾ വോൾട്ടേജ് സാവകാശം എങ്ങോട്ടാണ് എത്തേണ്ടത്?", ans: "പൂജ്യം" },
            { overMin: 6, overMax: 10, type: 'one-word', q: "മൊബൈൽ ഫോണിന്റെ മൊത്തത്തിലുള്ള കൺട്രോളിങ് നടക്കുന്ന പ്രധാന ഐസി ഏതാണ്?", ans: "CPU" },
            { overMin: 6, overMax: 10, type: 'one-word', q: "ഡിസി യെ AC ആക്കി മാറ്റുന്ന കൺവെർട്ടർ അറിയപ്പെടുന്ന പേര് എന്ത്?", ans: "ഓസിലേറ്റർ" },

            // Overs 10-15: One-sentence answers
            { overMin: 10, overMax: 15, type: 'sentence', q: "മൊബൈൽ ഫോണിൽ ചാർജർ കണക്ട് ചെയ്യുമ്പോൾ ചാർജിംഗ് സിംബൽ കാണിക്കുകയും എന്നാൽ ബാറ്ററി ചാർജ് കൂടാതെ ഇരിക്കുകയും ചെയ്യുന്ന തകരാറിനെ എന്ത് വിളിക്കുന്നു?", ans: "നോ ആംപിയർ" },
            { overMin: 10, overMax: 15, type: 'sentence', q: "ഒരു സർക്യൂട്ടിന്റെ ടോട്ടൽ റെസിസ്റ്റൻസിനെ മൊത്തത്തിൽ എന്ത് പേരിലാണ് വിളിക്കുന്നത്?", ans: "ഇംപെഡൻസ് (Impedance)" },

            // Overs 15-18: Three-sentence answers
            { overMin: 15, overMax: 18, type: 'detailed', q: "ബാക്ക് ലൈറ്റ് സെക്ഷന്റെ പ്രവർത്തന തത്വവും അതിൽ ഉപയോഗിക്കുന്ന പ്രധാന കോയിലായ L1 ന്റെ റോഡും വിശദീകരിക്കുക.", ans: "ബാക്ക് ലൈറ്റ് ഐസിയിലെ സ്വിച്ചിംഗിലൂടെ ഉയർന്ന വോൾട്ടേജ് ഉത്പാദിപ്പിച്ച് എൽഇഡി പ്രകാശിപ്പിക്കുന്ന സംവിധാനമാണിത്." },

            // Overs 18-20: Diagram/PDF Analysis
            { overMin: 18, overMax: 20, type: 'diagram', q: "സിം സെക്ഷനിൽ 'നോ സിം കാർഡ്' കംപ്ലൈന്റ് വരുമ്പോൾ നമ്മൾ ആദ്യം ചെക്ക് ചെയ്യേണ്ട രണ്ട് പ്രധാന ഘട്ടങ്ങൾ എഴുതുക.", ans: "സിം കാർഡ് കറക്റ്റ് ആണോ എന്നും സിം ട്രേ ശരിയായി കണക്ട് ചെയ്തിട്ടുണ്ടോ എന്നും ചെക്ക് ചെയ്യുക." }
        ];

        let gameState = {
            playerName: '',
            teamSize: 1,
            currentOver: 1,
            score: 0,
            wickets: 0,
            balls: 0,
            strike: 1
        };

        function startGame() {
            const name = document.getElementById('player-name').value;
            if(!name) {
                alert('ദയവായി പേര് നൽകുക!');
                return;
            }
            gameState.playerName = name;
            gameState.teamSize = parseInt(document.getElementById('team-size').value);
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            // Filter questions based on current over
            let availableQ = questionBank.filter(q => gameState.currentOver >= q.overMin && gameState.currentOver <= q.overMax);
            if(availableQ.length === 0) availableQ = questionBank; // fallback
            
            let currentQ = availableQ[Math.floor(Math.random() * availableQ.length)];
            
            document.getElementById('question-text').innerText = `Over ${gameState.currentOver} | ${currentQ.q}`;
            let optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            if(currentQ.type === 'mcq') {
                currentQ.options.forEach((opt, index) => {
                    let btn = document.createElement('button');
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(index === currentQ.ans, true);
                    optContainer.appendChild(btn);
                });
            } else {
                let input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-ans';
                input.placeholder = 'ഉത്തരം ഇവിടെ എഴുതുക...';
                let btn = document.createElement('button');
                btn.innerText = 'Submit Answer';
                btn.onclick = () => {
                    let userAns = document.getElementById('text-ans').value.trim();
                    checkAnswer(userAns.length > 0, false);
                };
                optContainer.appendChild(input);
                optContainer.appendChild(btn);
            }

            updateScoreboard();
        }

        function checkAnswer(isCorrect, isMcq) {
            if(isCorrect) {
                let runs = 4; // Simplified dynamic scoring
                gameState.score += runs;
                alert(`ശരിയാണ്! ${runs} റൺസ് ലഭിച്ചു.`);
            } else {
                gameState.wickets += 1;
                alert('തെറ്റായ ഉത്തരം! വിക്കറ്റ് നഷ്ടമായി.');
            }

            gameState.balls++;
            if(gameState.balls >= 6) {
                gameState.balls = 0;
                gameState.currentOver++;
                // Strike rotation on over end
                gameState.strike = gameState.strike === 1 ? 3 : 1;
            }

            if(gameState.currentOver > 20 || gameState.wickets >= gameState.teamSize) {
                alert(`കളി završiti! ടോട്ടൽ സ്കോർ: ${gameState.score}`);
                location.reload();
            } else {
                loadQuestion();
            }
        }

        function updateScoreboard() {
            document.getElementById('scoreboard-display').innerHTML = `
                <strong>കളിക്കാരൻ:</strong> ${gameState.playerName} | 
                <strong>സ്കോർ:</strong> ${gameState.score}/${gameState.wickets} <br>
                <strong>ഓവർ:</strong> ${Math.floor(gameState.currentOver)}.${gameState.balls} | 
                <strong>സ്ട്രൈക്ക്:</strong> പ്ലെയർ ${gameState.strike}
            `;
        }
    </script>
</body>
</html>
