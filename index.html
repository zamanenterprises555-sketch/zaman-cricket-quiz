<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1324">
<title>Zaman Cricket Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22">
<!-- Firebase (multiplayer) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<!-- ചോദ്യങ്ങൾ: questions.js മാത്രം മാറ്റിയാൽ മതി -->
<script src="questions.js"></script>
<script src="engine.js?v=22"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" class="logo" aria-hidden="true"><rect x="27" y="4" width="10" height="40" rx="4" fill="#f5c26b" transform="rotate(28 32 32)"/><rect x="29.5" y="38" width="5" height="18" rx="2" fill="#8a5a2b" transform="rotate(28 32 32)"/><circle cx="46" cy="47" r="8" fill="#e23b3b"/><path d="M40.5 43.5c3 2 8 2 11 0M40.5 50.5c3-2 8-2 11 0" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
      <div><b>ZAMAN</b><span class="bq"> CRICKET QUIZ</span></div>
    </div>
    <div id="topRight" class="topright"></div>
  </header>

  <main>
    <section id="chat" class="chatbox" hidden></section>
    <section id="home"></section>
    <section id="lobby" hidden></section>
    <section id="game" hidden>
      <div id="board"></div>
      <div id="panel"></div>
    </section>
    <section id="result" hidden></section>
  </main>
</div>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<script src="app.js?v=22"></script>
</body>
</html>
