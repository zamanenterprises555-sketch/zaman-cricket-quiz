<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaman Cricket Quiz - 5 Sets Edition</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1rem}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:1rem 0}
h1{color:#22c55e;font-size:1.4rem}
.card{background:#1e293b;border-radius:16px;padding:1.2rem;margin:0.8rem 0}
button{background:#22c55e;color:#0f172a;border:none;padding:0.8rem;border-radius:10px;font-weight:700;width:100%;margin:0.5rem 0;font-size:1rem;cursor:pointer}
button.solo{background:#f59e0b;color:#0f172a}
button.secondary{background:#334155;color:#e2e8f0}
input,select{width:100%;padding:0.8rem;border-radius:10px;border:none;margin:0.5rem 0;font-size:1rem;background:#334155;color:white}
.option{background:#334155;padding:0.8rem;margin:0.4rem 0;border-radius:10px;cursor:pointer;border:2px solid transparent}
.option.selected{background:#475569;border-color:#22c55e}
.hidden{display:none}
.scoreboard{display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.3rem}
.timer{font-size:2rem;text-align:center;color:#facc15;font-weight:700}
.small{font-size:0.8rem;color:#94a3b8}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏏 ZAMAN CRICKET QUIZ</h1>
    <p class="small">5 Overs • 5 Sets • Solo & Multiplayer</p>
  </header>

  <!-- HOME SCREEN -->
  <div id="home" class="card">
    <h2 style="text-align:center;margin-bottom:1rem">മോഡ് തിരഞ്ഞെടുക്കുക</h2>
    <input id="playerName" placeholder="നിങ്ങളുടെ പേര്" value="Player" maxlength="20">
    
    <button type="button" class="solo" onclick="startSoloMode()">⚡ സോളോ മോഡ് (Team A vs Team B)</button>
    <button type="button" class="secondary" onclick="createMultiplayerRoom()">🌐 മൾട്ടിപ്ലെയർ റൂം സൃഷ്ടിക്കുക</button>
    
    <div style="margin:0.8rem 0;border-top:1px solid #334155;padding-top:0.8rem;">
      <input id="roomCode" placeholder="റൂം കോഡ് നൽകുക" maxlength="6" style="text-transform:uppercase">
      <button type="button" class="secondary" onclick="joinMultiplayerRoom()">റൂമിൽ ജോയിൻ ചെയ്യുക</button>
    </div>

    <button type="button" id="rejoinBtn" class="secondary hidden" style="background:#3b82f6;color:white" onclick="rejoinGame()">🔄 കഴിഞ്ഞ കളി തുടരുക (Rejoin)</button>
  </div>

  <!-- SET SELECTION SCREEN (Inside Game Mode) -->
  <div id="setSelectionScreen" class="card hidden">
    <h2 style="text-align:center;margin-bottom:1rem">സെറ്റ് തിരഞ്ഞെടുക്കുക (5 ഓവർ)</h2>
    <select id="setSelect">
      <option value="0">സെറ്റ് 1 (Mixed Questions)</option>
      <option value="1">സെറ്റ് 2 (Mixed Questions)</option>
      <option value="2">സെറ്റ് 3 (Mixed Questions)</option>
      <option value="3">സെറ്റ് 4 (Mixed Questions)</option>
      <option value="4">സെറ്റ് 5 (Mixed Questions)</option>
    </select>
    <button type="button" onclick="confirmSetSelection()">സെറ്റ് ലോക്ക് ചെയ്ത് കളി തുടങ്ങുക</button>
  </div>

  <!-- MULTIPLAYER LOBBY -->
  <div id="lobby" class="card hidden">
    <h2>റൂം കോഡ്: <span id="displayRoom" style="color:#facc15"></span></h2>
    <div id="playerList" style="margin:1rem 0"></div>
    <div id="hostControls" class="hidden">
      <button type="button" onclick="startMultiplayerMatch()">മാച്ച് ആരംഭിക്കുക</button>
    </div>
    <p class="small" id="waitingMsg">ഹോസ്റ്റ് മാച്ച് ആരംഭിക്കുന്നത് വരെ കാത്തിരിക്കുക...</p>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" class="card hidden">
    <div class="scoreboard">
      <div>ഇന്നിങ്സ്: <b id="inningsTitle">ടീം A ബാറ്റിംഗ്</b></div>
      <div>സ്കോർ: <b id="score">0</b>/<b id="wickets">0</b></div>
      <div>ഓവർ: <b id="over">0.0</b></div>
      <div id="targetBox" class="hidden" style="width:100%;color:#facc15;margin-top:0.3rem">ടാർഗെറ്റ്: <b id="targetScore">0</b></div>
    </div>
    
    <div class="timer" id="timer">10</div>

    <!-- BOWLER PANEL (Solo Mode) -->
    <div id="soloBowlerPanel" class="card">
      <h3 id="qTypeLabel">ചോദ്യം തിരഞ്ഞെടുക്കുക</h3>
      <select id="qSelect"></select>
      <button type="button" onclick="soloAskQuestion()">ചോദ്യം നൽകുക</button>
    </div>

    <!-- QUESTION / BATSMAN PANEL -->
    <div id="questionCard" class="card hidden">
      <h3 id="question" style="font-size:1rem;margin-bottom:1rem"></h3>
      <div id="options"></div>
      <textarea id="textAnswer" class="hidden" rows="3" placeholder="ഉത്തരം എഴുതുക..."></textarea>
      <button type="button" id="submitText" class="hidden" onclick="submitTextAnswer()">ഉത്തരം സമർപ്പിക്കുക</button>
    </div>

    <div id="resultMsg" style="text-align:center;font-weight:bold;margin-top:1rem;font-size:1.1rem"></div>
    <button type="button" class="secondary" style="background:#ef4444;color:white;margin-top:1.5rem" onclick="quitGame()">ഹോം പേജിലേക്ക് പോവുക</button>
  </div>

  <!-- SUMMARY SCREEN -->
  <div id="summary" class="card hidden">
    <h2>മാച്ച് ഫലം</h2>
    <div id="summaryContent" style="margin:1rem 0;font-size:1.1rem;line-height:1.6"></div>
    <button type="button" onclick="quitGame()">ഹോം പേജിലേക്ക്</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKQQRIcz1eEsz-V0r8WYsOCXBjAsR6XNQ",
  authDomain: "zaman-6587f.firebaseapp.com",
  databaseURL: "https://zaman-6587f-default-rtdb.firebaseio.com",
  projectId: "zaman-6587f",
  storageBucket: "zaman-6587f.firebasestorage.app",
  messagingSenderId: "985807833692",
  appId: "1:985807833692:web:4d331bd0b2e8db0fcdb499"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 5 Sets of Questions (30 questions each for 5 Overs)
const questionSets = [
  // Set 1
  [
    {q:"ഇലക്ട്രോണുകൾ ചലിക്കാൻ നൽകുന്ന ശക്തിയെ എന്ത് പറയുന്നു?",o:["Current","Voltage (EMF)","Resistance","Power"],a:1,type:"mcq",time:10},
    {q:"Voltage-ന്റെ മറ്റൊരു പേര് എന്താണ്?",o:["Current","Electro Motive Force","Resistance","Power"],a:1,type:"mcq",time:10},
    {q:"വൈദ്യുതിയെ പൂർണ്ണമായും കടത്തിവിടുന്ന വസ്തുക്കളെ എന്ത് പറയുന്നു?",o:["Insulator","Conductor","Semi Conductor","Resistor"],a:1,type:"mcq",time:10},
    {q:"Conductor-ന്റെ ഉദാഹരണം എഴുതുക (ഒറ്റ വാക്ക്)",o:[],type:"word",time:60},
    {q:"Resistor-ന്റെ പ്രവർത്തനം ചുരുക്കി എഴുതുക (3 വാചകം)",o:[],type:"sentence",time:300},
    {q:"Mobile Phone PCB-യുടെ പ്രധാന ഘടന വിവരിക്കുക (5 വാചകം)",o:[],type:"para",time:600}
  ],
  // Set 2 (Sample structure)
  [
    {q:"Capacitor-ന്റെ യൂണിറ്റ് എന്താണ്?",o:["Ohm","Farad","Henry","Ampere"],a:1,type:"mcq",time:10},
    {q:"Diode-ൽ P ഭാഗത്തെ എന്ത് പറയുന്നു?",o:["Cathode","Anode","Base","Emitter"],a:1,type:"mcq",time:10},
    {q:"Transformer എന്ത് ചെയ്യുന്നു?",o:[""],type:"word",time:60},
    {q:"Power IC-യുടെ പ്രധാന ജോലികൾ വിശദീകരിക്കുക (3 വാചകം)",o:[],type:"sentence",time:300}
  ],
  // Set 3, 4, 5 can follow similar structure
  [{q:"Ohm's Law ഫോർമുല എന്താണ്?",o:["V=IR","P=VI","E=MC²","F=MA"],a:0,type:"mcq",time:10}],
  [{q:"PCB യുടെ പൂർണ്ണരൂപം എഴുതുക",o:["Printed Circuit Board"],a:0,type:"mcq",time:10}],
  [{q:"Multimeter എന്ത് അളക്കുന്നു?",o:["Voltage, Current, Resistance"],a:1,type:"mcq",time:10}]
];

let currentSetQuestions = [];
let isSolo = true;
let soloState = {
  innings: 1,
  scoreA: 0, wicketsA: 0,
  scoreB: 0, wicketsB: 0,
  ball: 0, over: 0,
  used: [], currentQ: null, target: 0, selectedSet: 0
};

let timer = null, timeLeft = 10, startTime = 0;
let roomId = null, playerId = null, gameRef = null;

window.onload = function() {
  if(localStorage.getItem('zaman_solo_save') || localStorage.getItem('zaman_mp_room')) {
    document.getElementById('rejoinBtn').classList.remove('hidden');
  }
};

// Timing & Runs Logic based on your exact rules
function calcRuns(time, limit) {
  const ratio = time / limit;
  if(limit === 10) {
    if(time <= 2) return 6;
    if(time <= 4) return 4;
    if(time <= 6) return 3;
    if(time <= 8) return 2;
    if(time <= 10) return 1;
    return 0; // wicket
  } else {
    // Scaled ratio for 1 min, 5 min, 10 min
    if(ratio <= 0.2) return 6;
    if(ratio <= 0.4) return 4;
    if(ratio <= 0.6) return 3;
    if(ratio <= 0.8) return 2;
    if(ratio <= 1.0) return 1;
    return 0;
  }
}

// --- SOLO MODE LOGIC ---
function startSoloMode() {
  isSolo = true;
  const saved = localStorage.getItem('zaman_solo_save');
  if(saved) {
    soloState = JSON.parse(saved);
    currentSetQuestions = questionSets[soloState.selectedSet] || questionSets[0];
    document.getElementById('home').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    updateSoloUI();
    populateSoloQSelect();
  } else {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('setSelectionScreen').classList.remove('hidden');
  }
}

function confirmSetSelection() {
  const setIdx = parseInt(document.getElementById('setSelect').value);
  soloState = { innings: 1, scoreA: 0, wicketsA: 0, scoreB: 0, wicketsB: 0, ball: 0, over: 0, used: [], currentQ: null, target: 0, selectedSet: setIdx };
  currentSetQuestions = questionSets[setIdx] || questionSets[0];
  saveSoloState();

  document.getElementById('setSelectionScreen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('soloBowlerPanel').classList.remove('hidden');
  
  updateSoloUI();
  populateSoloQSelect();
}

function saveSoloState() {
  localStorage.setItem('zaman_solo_save', JSON.stringify(soloState));
}

function updateSoloUI() {
  const currentScore = soloState.innings === 1 ? soloState.scoreA : soloState.scoreB;
  const currentWickets = soloState.innings === 1 ? soloState.wicketsA : soloState.wicketsB;
  
  document.getElementById('inningsTitle').textContent = soloState.innings === 1 ? "ടീം A ബാറ്റിംഗ്" : "ടീം B ബാറ്റിംഗ് (ടാർഗെറ്റ്: " + soloState.target + ")";
  document.getElementById('score').textContent = currentScore;
  document.getElementById('wickets').textContent = currentWickets;
  document.getElementById('over').textContent = soloState.over + "." + soloState.ball;
  
  if(soloState.innings === 2) {
    document.getElementById('targetBox').classList.remove('hidden');
    document.getElementById('targetScore').textContent = soloState.target;
  }
}

function populateSoloQSelect() {
  const sel = document.getElementById('qSelect');
  sel.innerHTML = "";
  currentSetQuestions.forEach((q, i) => {
    if(!soloState.used.includes(i)) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i+1) + ". [" + q.type.toUpperCase() + "] " + q.q;
      sel.appendChild(opt);
    }
  });
  if(sel.options.length === 0) {
    sel.innerHTML = "<option>എല്ലാ ചോദ്യങ്ങളും തീർന്നു</option>";
  }
}

function soloAskQuestion() {
  const val = document.getElementById('qSelect').value;
  if(val === "" || val.includes("തീർന്നു")) return alert("ഒരു ചോദ്യം തിരഞ്ഞെടുക്കുക");
  
  soloState.currentQ = parseInt(val);
  document.getElementById('soloBowlerPanel').classList.add('hidden');
  document.getElementById('questionCard').classList.remove('hidden');
  
  const q = currentSetQuestions[soloState.currentQ];
  document.getElementById('question').textContent = q.q;
  const optDiv = document.getElementById('options');
  const ta = document.getElementById('textAnswer');
  const sb = document.getElementById('submitText');
  optDiv.innerHTML = "";

  if(q.type === "mcq") {
    ta.classList.add('hidden');
    sb.classList.add('hidden');
    q.o.forEach((opt, i) => {
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.textContent = opt;
      btn.onclick = () => submitSoloAnswer(i, null);
      optDiv.appendChild(btn);
    });
  } else {
    ta.classList.remove('hidden');
    sb.classList.remove('hidden');
    ta.value = "";
  }

  timeLeft = q.time;
  document.getElementById('timer').textContent = timeLeft;
  startTime = Date.now();
  
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if(timeLeft <= 0) {
      clearInterval(timer);
      submitSoloAnswer(-1, null); // Timeout = Wicket
    }
  }, 1000);
}

function submitTextAnswer() {
  clearInterval(timer);
  const text = document.getElementById('textAnswer').value.trim();
  submitSoloAnswer(null, text);
}

function submitSoloAnswer(selectedChoice, textInput) {
  clearInterval(timer);
  const timeTaken = (Date.now() - startTime) / 1000;
  const q = currentSetQuestions[soloState.currentQ];
  
  let runs = 0, wicket = false;
  
  if(q.type === "mcq") {
    if(selectedChoice === q.a) {
      runs = calcRuns(timeTaken, q.time);
      if(runs === 0) wicket = true;
    } else {
      wicket = true;
    }
  } else {
    // Non-MCQ evaluation based on timing ratio
    if(textInput !== "" && timeTaken <= q.time) {
      runs = calcRuns(timeTaken, q.time);
      if(runs === 0) wicket = true;
    } else {
      wicket = true;
    }
  }

  if(soloState.innings === 1) {
    soloState.scoreA += runs;
    if(wicket) soloState.wicketsA++;
  } else {
    soloState.scoreB += runs;
    if(wicket) soloState.wicketsB++;
  }

  soloState.ball++;
  if(soloState.ball >= 6) {
    soloState.ball = 0;
    soloState.over++;
  }
  soloState.used.push(soloState.currentQ);

  showResultPopup(runs, wicket, timeTaken);
  document.getElementById('questionCard').classList.add('hidden');
  
  // Innings / Match End Check (5 overs max = 30 balls)
  const maxWickets = 2; // Can adjust as needed
  const maxOvers = 5;

  if(soloState.innings === 1 && (soloState.wicketsA >= maxWickets || soloState.over >= maxOvers)) {
    soloState.target = soloState.scoreA + 1;
    soloState.innings = 2;
    soloState.over = 0;
    soloState.ball = 0;
    soloState.used = [];
    alert("ടീം A യുടെ ഇന്നിങ്സ് അവസാനിച്ചു! ടാർഗെറ്റ്: " + soloState.target);
  } else if(soloState.innings === 2) {
    if(soloState.scoreB >= soloState.target) {
      endSoloGame("ടീം B വിജയിച്ചു! 🎉");
      return;
    }
    if(soloState.wicketsB >= maxWickets || soloState.over >= maxOvers) {
      if(soloState.scoreB >= soloState.target) {
        endSoloGame("ടീം B വിജയിച്ചു! 🎉");
      } else if(soloState.scoreB === soloState.target - 1) {
        endSoloGame("കളി ടൈ ആയി! 🤝");
      } else {
        endSoloGame("ടീം A വിജയിച്ചു! 🎉");
      }
      return;
    }
  }

  saveSoloState();
  updateSoloUI();
  populateSoloQSelect();
  document.getElementById('soloBowlerPanel').classList.remove('hidden');
}

function showResultPopup(runs, wicket, time) {
  const msg = document.getElementById('resultMsg');
  msg.textContent = wicket ? `വിക്കറ്റ്! (${time.toFixed(1)}s)` : `${runs} റൺസ്! (${time.toFixed(1)}s)`;
  msg.style.color = wicket ? "#ef4444" : "#22c55e";
  setTimeout(() => { msg.textContent = ""; }, 2500);
}

function endSoloGame(resultText) {
  localStorage.removeItem('zaman_solo_save');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('summary').classList.remove('hidden');
  document.getElementById('summaryContent').innerHTML = `
    <b>ടീം A സ്കോർ:</b> ${soloState.scoreA}/${soloState.wicketsA}<br>
    <b>ടീം B സ്കോർ:</b> ${soloState.scoreB}/${soloState.wicketsB}<br><br>
    <h3 style="color:#facc15">${resultText}</h3>
  `;
}

// --- MULTIPLAYER & REJOIN ---
function createMultiplayerRoom() {
  const name = document.getElementById('playerName').value.trim() || "Player";
  roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
  playerId = "p_" + Date.now();
  
  localStorage.setItem('zaman_mp_room', roomId);
  localStorage.setItem('zaman_mp_player', playerId);

  gameRef = db.ref("rooms/" + roomId);
  gameRef.set({
    host: playerId,
    players: { [playerId]: { name: name, role: "host" } },
    status: "lobby"
  });

  enterLobby();
}

function joinMultiplayerRoom() {
  const name = document.getElementById('playerName').value.trim() || "Player";
  roomId = document.getElementById('roomCode').value.trim().toUpperCase();
  if(!roomId) return alert("റൂം കോഡ് നൽകുക");

  playerId = "p_" + Date.now();
  localStorage.setItem('zaman_mp_room', roomId);
  localStorage.setItem('zaman_mp_player', playerId);

  gameRef = db.ref("rooms/" + roomId);
  gameRef.once("value", snap => {
    if(!snap.exists()) return alert("റൂം കണ്ടെത്തിയില്ല");
    gameRef.child("players/" + playerId).set({ name: name, role: "player" });
    enterLobby();
  });
}

function enterLobby() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
  document.getElementById('displayRoom').textContent = roomId;

  gameRef.on("value", snap => {
    const d = snap.val();
    if(!d) return;
    let listHtml = "<b>പ്ലേയേഴ്സ്:</b><br>";
    let isHost = d.host === playerId;
    
    Object.values(d.players || {}).forEach(p => {
      listHtml += `• ${p.name}<br>`;
    });
    document.getElementById('playerList').innerHTML = listHtml;

    if(isHost) {
      document.getElementById('hostControls').classList.remove('hidden');
      document.getElementById('waitingMsg').classList.add('hidden');
    }

    if(d.status === "playing") {
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('soloBowlerPanel').classList.add('hidden');
    }
  });
}

function startMultiplayerMatch() {
  gameRef.update({ status: "playing" });
}

function rejoinGame() {
  if(localStorage.getItem('zaman_solo_save')) {
    startSoloMode();
  } else if(localStorage.getItem('zaman_mp_room')) {
    roomId = localStorage.getItem('zaman_mp_room');
    playerId = localStorage.getItem('zaman_mp_player');
    gameRef = db.ref("rooms/" + roomId);
    enterLobby();
  }
}

function quitGame() {
  localStorage.removeItem('zaman_solo_save');
  localStorage.removeItem('zaman_mp_room');
  location.reload();
}
</script>
</body>
</html>
