<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaman Cricket Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1rem}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:1rem 0}
h1{color:#22c55e;font-size:1.4rem}
.card{background:#1e293b;border-radius:16px;padding:1.2rem;margin:0.8rem 0}
button{background:#22c55e;color:#0f172a;border:none;padding:0.8rem;border-radius:10px;font-weight:700;width:100%;margin:0.5rem 0;font-size:1rem;cursor:pointer}
button.solo{background:#f59e0b;color:#0f172a}
button.rejoin{background:#3b82f6;color:white}
input,select{width:100%;padding:0.8rem;border-radius:10px;border:none;margin:0.5rem 0;font-size:1rem;background:#334155;color:white}
.option{background:#334155;padding:0.8rem;margin:0.4rem 0;border-radius:10px;cursor:pointer}
.hidden{display:none}
.scoreboard{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:0.5rem}
.timer{font-size:2rem;text-align:center;color:#facc15;font-weight:700}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏏 ZAMAN CRICKET QUIZ</h1>
    <p style="font-size:0.8rem;color:#94a3b8">Solo Edition with Rejoin</p>
  </header>

  <div id="home" class="card">
    <h2 style="text-align:center;margin-bottom:1rem">കളി തുടങ്ങാൻ പേര് നൽകുക</h2>
    <input id="playerName" placeholder="നിങ്ങളുടെ പേര്" value="Player">
    <button type="button" class="solo" onclick="startSoloGame(false)">⚡ പുതിയ സോളോ ഗെയിം</button>
    <button type="button" id="rejoinBtn" class="rejoin hidden" onclick="startSoloGame(true)">🔄 കഴിഞ്ഞ കളി തുടരുക (Rejoin)</button>
  </div>

  <div id="game" class="card hidden">
    <div class="scoreboard">
      <div>സ്കോർ: <b id="score">0</b>/<b id="wickets">0</b></div>
      <div>ഓവർ: <b id="over">0.0</b></div>
    </div>
    <div class="timer" id="timer">10</div>
    <div id="questionBox">
      <h3 id="qText" style="margin-bottom:1rem;font-size:1.1rem">ചോദ്യം ഇവിടെ വരും</h3>
      <div id="options"></div>
    </div>
    <div id="resultMsg" style="text-align:center;font-weight:bold;margin-top:1rem;font-size:1.2rem"></div>
    <button type="button" style="background:#ef4444;color:white;margin-top:1.5rem" onclick="quitGame()">ഹോം പേജിലേക്ക് പോവുക</button>
  </div>

  <div id="summary" class="card hidden">
    <h2>മാച്ച് അവസാനിപ്പിച്ചു</h2>
    <p id="finalScoreText" style="margin:1rem 0;font-size:1.2rem"></p>
    <button type="button" onclick="quitGame()">പുതിയ ഗെയിം തുടങ്ങുക</button>
  </div>
</div>

<script>
const questions = [
  {q:"ഇലക്ട്രോണുകൾ ചലിക്കാൻ നൽകുന്ന ശക്തിയെ എന്ത് പറയുന്നു?",o:["Current","Voltage (EMF)","Resistance","Power"],a:1},
  {q:"Voltage-ന്റെ മറ്റൊരു പേര് എന്താണ്?",o:["Current","Electro Motive Force","Resistance","Power"],a:1},
  {q:"വൈദ്യുതിയെ പൂർണ്ണമായും കടത്തിവിടുന്ന വസ്തുക്കളെ എന്ത് പറയുന്നു?",o:["Insulator","Conductor","Semi Conductor","Resistor"],a:1},
  {q:"Conductor-ന്റെ ഉദാഹരണം ഏതാണ്?",o:["പ്ലാസ്റ്റിക്","തടി","ചെമ്പ്","റബ്ബർ"],a:2},
  {q:"വൈദ്യുതിയെ കടത്തിവിടാത്ത വസ്തുക്കളെ എന്ത് പറയുന്നു?",o:["Conductor","Insulator","Semi Conductor","Diode"],a:1},
  {q:"Insulator-ന്റെ ഉദാഹരണം ഏതാണ്?",o:["ചെമ്പ്","ഇരുമ്പ്","പ്ലാസ്റ്റിക്","സ്വർണം"],a:2},
  {q:"അർദ്ധചാലകം എന്ന് അറിയപ്പെടുന്നത് ഏത്?",o:["Conductor","Insulator","Semi Conductor","Resistor"],a:2},
  {q:"Resistor-ന്റെ യൂണിറ്റ് എന്താണ്?",o:["Farad","Ohm","Henry","Watt"],a:1},
  {q:"Capacitor-ന്റെ യൂണിറ്റ് എന്താണ്?",o:["Ohm","Farad","Henry","Ampere"],a:1},
  {q:"Diode-ൽ P ഭാഗത്തെ എന്ത് പറയുന്നു?",o:["Cathode","Anode","Base","Emitter"],a:1}
];

let score = 0, wickets = 0, ball = 0, over = 0, currentIdx = 0, timer = null, timeLeft = 10;

window.onload = function() {
  const savedGame = localStorage.getItem('zaman_quiz_save');
  if(savedGame) {
    document.getElementById('rejoinBtn').classList.remove('hidden');
  }
};

function startSoloGame(isRejoin) {
  const name = document.getElementById('playerName').value.trim();
  if(!name) return alert("ദയവായി പേര് നൽകുക");

  if(isRejoin) {
    const saved = JSON.parse(localStorage.getItem('zaman_quiz_save'));
    if(saved) {
      score = saved.score;
      wickets = saved.wickets;
      ball = saved.ball;
      over = saved.over;
      currentIdx = saved.currentIdx;
    }
  } else {
    score = 0; wickets = 0; ball = 0; over = 0; currentIdx = 0;
    saveGameState();
  }
  
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  updateScoreboard();
  loadNextQuestion();
}

function saveGameState() {
  const state = { score, wickets, ball, over, currentIdx };
  localStorage.setItem('zaman_quiz_save', JSON.stringify(state));
}

function updateScoreboard() {
  document.getElementById('score').textContent = score;
  document.getElementById('wickets').textContent = wickets;
  document.getElementById('over').textContent = over + "." + ball;
}

function loadNextQuestion() {
  if(currentIdx >= questions.length || wickets >= 1 || over >= 3) {
    endGame();
    return;
  }
  
  const q = questions[currentIdx];
  document.getElementById('qText').textContent = (currentIdx + 1) + ". " + q.q;
  const optDiv = document.getElementById('options');
  optDiv.innerHTML = "";
  
  q.o.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(i, q.a);
    optDiv.appendChild(btn);
  });
  
  timeLeft = 10;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('resultMsg').textContent = "";
  
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if(timeLeft <= 0) {
      clearInterval(timer);
      checkAnswer(-1, q.a);
    }
  }, 1000);
}

function checkAnswer(selected, correct) {
  clearInterval(timer);
  const msg = document.getElementById('resultMsg');
  
  if(selected === correct) {
    score += 4;
    msg.style.color = "#22c55e";
    msg.textContent = "ശരിയാണ്! 4 റൺസ് നേടി";
  } else {
    wickets++;
    msg.style.color = "#ef4444";
    msg.textContent = "വിക്കറ്റ് നഷ്ടമായി!";
  }
  
  ball++;
  if(ball >= 6) {
    ball = 0;
    over++;
  }
  
  updateScoreboard();
  currentIdx++;
  saveGameState();
  
  setTimeout(loadNextQuestion, 1500);
}

function endGame() {
  localStorage.removeItem('zaman_quiz_save');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('summary').classList.remove('hidden');
  document.getElementById('finalScoreText').textContent = "മൊത്തം സ്കോർ: " + score + "/" + wickets;
}

function quitGame() {
  localStorage.removeItem('zaman_quiz_save');
  location.reload();
}
</script>
</body>
</html>
