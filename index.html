<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<title>Zaman Cricket Quiz</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Noto Sans Malayalam',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:520px;margin:0 auto;padding:1rem}
header{text-align:center;padding:1rem 0}
h1{color:#22c55e;font-size:1.4rem}
.card{background:#1e293b;border-radius:16px;padding:1.2rem;margin:0.8rem 0}
button{background:#22c55e;color:#0f172a;border:none;padding:0.7rem 1.2rem;border-radius:10px;font-weight:700;width:100%;margin:0.3rem 0;font-size:1rem;cursor:pointer}
button.secondary{background:#334155;color:#e2e8f0}
input,select,textarea{width:100%;padding:0.7rem;border-radius:10px;border:none;margin:0.3rem 0;font-size:1rem;background:#334155;color:white}
.option{background:#334155;padding:0.8rem;margin:0.4rem 0;border-radius:10px;cursor:pointer;border:2px solid transparent}
.option.selected{background:#475569;border-color:#22c55e}
.scoreboard{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.4rem}
.timer{font-size:2rem;text-align:center;color:#facc15;font-weight:700}
.hidden{display:none}
.small{font-size:0.8rem;color:#94a3b8}
.role{font-size:0.7rem;background:#22c55e;color:#0f172a;padding:0.1rem 0.4rem;border-radius:10px;margin-left:0.3rem}
.stats{font-size:0.85rem;background:#0f172a;padding:0.5rem;border-radius:8px;margin-top:0.5rem}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏏 ZAMAN CRICKET QUIZ</h1>
    <p class="small">Multiplayer • 20 Overs • Mobile Electronics Edition</p>
  </header>
  <div id="home" class="card">
    <h2 style="text-align:center;margin-bottom:1rem">റൂം</h2>
    <input id="playerName" placeholder="നിങ്ങളുടെ പേര്" maxlength="20">
    <button type="button" onclick="createRoom()">പുതിയ റൂം സൃഷ്ടിക്കുക</button>
    <input id="roomCode" placeholder="റൂം കോഡ്" maxlength="6" style="text-transform:uppercase">
    <button type="button" class="secondary" onclick="joinRoom()">ജോയിൻ ചെയ്യുക</button>
    <button type="button" class="secondary" onclick="rejoinRoom()">റീജോയിൻ</button>
  </div>
  <div id="lobby" class="card hidden">
    <h2>റൂം: <span id="displayRoom"></span></h2>
    <div id="playerList"></div>
    <div id="hostControls" class="hidden">
      <h3 style="margin:1rem 0 0.5rem">ടീം സെറ്റിംഗ്</h3>
      <label>ബാറ്റിംഗ് ടീം</label>
      <input type="number" id="battingCount" value="2" min="1" max="11">
      <label>ബൗളിംഗ് ടീം</label>
      <input type="number" id="bowlingCount" value="1" min="1" max="11">
      <button type="button" onclick="startMatch()">മാച്ച് ആരംഭിക്കുക</button>
    </div>
    <p class="small" id="waitingMsg">ഹോസ്റ്റ് മാച്ച് ആരംഭിക്കുന്നത് വരെ കാത്തിരിക്കുക...</p>
  </div>
  <div id="game" class="hidden">
    <div class="scoreboard">
      <div>സ്കോർ: <b id="score">0</b>/<b id="wickets">0</b></div>
      <div>ഓവർ: <b id="over">0.0</b></div>
      <div>എക്സ്ട്രാ: <b id="extras">0</b></div>
      <div>RR: <b id="rr">0.00</b></div>
    </div>
    <div class="small">സ്ട്രൈക്കർ: <span id="striker"></span> | ബൗളർ: <span id="bowler"></span></div>
    <div id="lastBalls" class="small"></div>
    <div class="timer" id="timer">10</div>
    <div id="bowlerPanel" class="card hidden">
      <h3>ബൗളർ പാനൽ</h3>
      <button type="button" class="secondary" onclick="changeBowler()">ബൗളർ മാറ്റുക</button>
      <label>ചോദ്യം സെലക്ട് ചെയ്യുക</label>
      <select id="qSelect"></select>
      <div class="small" id="qTypeInfo"></div>
      <button type="button" onclick="bowlerSelectQuestion()">ചോദ്യം സെലക്ട് ചെയ്യുക</button>
      <div id="bowlerAnswerArea" class="hidden">
        <p id="bowlerQText"></p>
        <div id="bowlerOptions"></div>
        <button type="button" onclick="bowlerSubmitAnswer()">ഉത്തരം സമർപ്പിക്കുക</button>
      </div>
    </div>
    <div id="questionCard" class="card hidden">
      <div id="question" style="font-size:1.05rem;margin-bottom:1rem"></div>
      <div id="options"></div>
      <textarea id="textAnswer" class="hidden" rows="3" placeholder="ഉത്തരം എഴുതുക..."></textarea>
      <button type="button" id="submitText" class="hidden" onclick="submitTextAnswer()">ഉത്തരം സമർപ്പിക്കുക</button>
    </div>
    <div id="spectatorView" class="card hidden">
      <h3>ലൈവ് വ്യൂ</h3>
      <p id="specInfo">കാത്തിരിക്കുന്നു...</p>
    </div>
    <div id="playerStats" class="stats hidden"></div>
    <div id="result" class="card hidden"></div>
  </div>
  <div id="summary" class="card hidden">
    <h2>മാച്ച് സമ്മറി</h2>
    <div id="summaryContent"></div>
  </div>
</div>

function getQuestionType(over){
  if(over<6) return {type:"mcq",time:10,label:"MCQ (10 സെക്കൻഡ്)"};
  if(over<10) return {type:"word",time:60,label:"ഒറ്റ വാക്ക് (1 മിനിറ്റ്)"};
  if(over<15) return {type:"sentence",time:300,label:"ഒരു വാചകം (5 മിനിറ്റ്)"};
  if(over<18) return {type:"para",time:600,label:"മൂന്ന് വാചകം (10 മിനിറ്റ്)"};
  return {type:"mark",time:600,label:"PDF മാർക്ക് (10 മിനിറ്റ്)"};
}

function calcRuns(time,limit){
  const ratio=time/limit;
  if(ratio<=0.2) return 6;
  if(ratio<=0.3) return 4;
  if(ratio<=0.5) return 3;
  if(ratio<=0.7) return 2;
  if(ratio<=1.0) return 1;
  return 0;
}

function speak(text){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ml-IN';
    speechSynthesis.speak(u);
  }
}

function generateCode(){return Math.random().toString(36).substring(2,8).toUpperCase();}

function createRoom(){
  playerName=document.getElementById('playerName').value.trim()||"Player";
  roomId=generateCode();
  localStorage.setItem('quizRoom',roomId);
  localStorage.setItem('quizName',playerName);
  playerId="p"+Date.now();
  isHost=true;
  gameRef=db.ref("rooms/"+roomId);
  gameRef.set({
    host:playerId,players:{[playerId]:{name:playerName,role:"host",runs:0,balls:0}},
    status:"lobby",score:0,wickets:0,extras:0,ball:0,over:0,innings:1,
    currentQ:null,used:[],phase:"select",lastBalls:[],playerStats:{}
  });
  enterLobby();
}

function joinRoom(){
  playerName=document.getElementById('playerName').value.trim()||"Player";
  roomId=document.getElementById('roomCode').value.trim().toUpperCase();
  if(!roomId)return alert("റൂം കോഡ് നൽകുക");
  localStorage.setItem('quizRoom',roomId);
  localStorage.setItem('quizName',playerName);
  playerId="p"+Date.now();
  gameRef=db.ref("rooms/"+roomId);
  gameRef.once("value",snap=>{
    if(!snap.exists())return alert("റൂം കണ്ടെത്തിയില്ല");
    gameRef.child("players/"+playerId).set({name:playerName,role:"spectator",runs:0,balls:0});
    enterLobby();
  });
}

function rejoinRoom(){
  const savedRoom=localStorage.getItem('quizRoom');
  const savedName=localStorage.getItem('quizName');
  if(!savedRoom)return alert("മുമ്പ് ജോയിൻ ചെയ്ത റൂം ഇല്ല");
  playerName=savedName||"Player";
  roomId=savedRoom;
  gameRef=db.ref("rooms/"+roomId);
  gameRef.once("value",snap=>{
    if(!snap.exists())return alert("റൂം കണ്ടെത്തിയില്ല");
    const d=snap.val();
    let existingId=null;
    Object.entries(d.players||{}).forEach(([id,p])=>{
      if(p.name===playerName)existingId=id;
    });
    if(existingId){
      playerId=existingId;
    }else{
      playerId="p"+Date.now();
      gameRef.child("players/"+playerId).set({name:playerName,role:"spectator",runs:0,balls:0});
    }
    enterLobby();
  });
}

function enterLobby(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
  document.getElementById('displayRoom').textContent=roomId;
  if(isHost){
    document.getElementById('hostControls').classList.remove('hidden');
    document.getElementById('waitingMsg').classList.add('hidden');
  }
  gameRef.off();
  gameRef.on("value",snap=>{
    const d=snap.val();if(!d)return;
    renderPlayers(d);
    if(d.status==="playing")showGame(d);
    if(d.status==="finished")showSummary(d);
  });
}

function renderPlayers(d){
  const list=document.getElementById('playerList');
  if(!list)return;
  list.innerHTML="<b>പ്ലേയേഴ്സ് ("+Object.keys(d.players||{}).length+"):</b><br>";
  Object.entries(d.players||{}).forEach(([id,p])=>{
    list.innerHTML+=`<div>• ${p.name} <span class="role">${p.role||"spectator"}</span></div>`;
    if(id===playerId)myRole=p.role||"spectator";
  });
}

function startMatch(){
  const bc=parseInt(document.getElementById('battingCount').value)||2;
  const bow=parseInt(document.getElementById('bowlingCount').value)||1;
  gameRef.once("value",snap=>{
    const d=snap.val();
    const pids=Object.keys(d.players||{});
    if(pids.length<bc+bow)return alert("മതിയായ പ്ലേയേഴ്സ് ഇല്ല");
    const batting=pids.slice(0,bc);
    const bowling=pids.slice(bc,bc+bow);
    const updates={status:"playing",score:0,wickets:0,extras:0,ball:0,over:0,innings:1,used:[],phase:"select",battingCount:bc,bowlingCount:bow,battingOrder:batting,bowlingOrder:bowling,currentBowlerIndex:0,lastBalls:[],target:null};
    batting.forEach((id,i)=>updates[`players/${id}/role`]=i===0?"striker":(i===1?"nonstriker":"batsman"));
    bowling.forEach((id,i)=>updates[`players/${id}/role`]=i===0?"bowler":"bowling");
    updates.striker=batting[0];
    updates.nonstriker=batting[1]||null;
    updates.bowler=bowling[0];
    gameRef.update(updates);
  });
}

function showGame(d){
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  updateScore(d);
  const qt=getQuestionType(d.over||0);
  document.getElementById('qTypeInfo').textContent="തരം: "+qt.label;
  document.getElementById('bowlerPanel').classList.toggle('hidden',myRole!=="bowler");
  document.getElementById('questionCard').classList.toggle('hidden',!(myRole==="striker"||myRole==="batsman")||d.phase!=="bowl");
  document.getElementById('spectatorView').classList.toggle('hidden',myRole==="bowler"||myRole==="striker"||myRole==="batsman");
  if(myRole==="bowler"&&d.phase==="select")populateQSelect(d);
  if(d.phase==="bowl"&&(myRole==="striker"||myRole==="batsman"))loadBatsmanQuestion(d);
  if(myRole!=="striker"&&myRole!=="batsman"&&d.currentQ!==null)showSpectator(d);
  showPlayerStats(d);
}

function updateScore(d){
  const total=(d.score||0)+(d.extras||0);
  document.getElementById('score').textContent=total;
  document.getElementById('wickets').textContent=d.wickets||0;
  document.getElementById('extras').textContent=d.extras||0;
  document.getElementById('over').textContent=(d.over||0)+"."+(d.ball||0);
  const balls=(d.over||0)*6+(d.ball||0);
  const rr=balls>0?(total/(balls/6)).toFixed(2):"0.00";
  document.getElementById('rr').textContent=rr;
  let st=d.players?.[d.striker]?.name||"-";
  if(d.nonstriker)st+=" / "+(d.players?.[d.nonstriker]?.name||"");
  document.getElementById('striker').textContent=st;
  document.getElementById('bowler').textContent=d.players?.[d.bowler]?.name||"-";
  const lb=d.lastBalls||[];
  document.getElementById('lastBalls').textContent="അവസാനം: "+lb.slice(-5).join(" ");
}

function showPlayerStats(d){
  const div=document.getElementById('playerStats');
  div.classList.remove('hidden');
  let html="<b>പ്ലേയർ സ്റ്റാറ്റ്സ്</b><br>";
  Object.entries(d.players||{}).forEach(([id,p])=>{
    if(p.runs||p.balls)html+=`${p.name}: ${p.runs||0} റൺസ് (${p.balls||0} ബോൾ)<br>`;
  });
  div.innerHTML=html;
}

function populateQSelect(d){
  const sel=document.getElementById('qSelect');
  sel.innerHTML="";
  questions.forEach((q,i)=>{
    if(!(d.used||[]).includes(i)){
      const opt=document.createElement('option');
      opt.value=i;opt.textContent=(i+1)+". "+q.q;
      sel.appendChild(opt);
    }
  });
  if(sel.options.length===0){
    sel.innerHTML="<option>ചോദ്യങ്ങൾ തീർന്നു</option>";
  }
}

function changeBowler(){
  gameRef.once("value",snap=>{
    const d=snap.val();
    const order=d.bowlingOrder||[];
    if(order.length<2)return alert("മറ്റ് ബൗളർ ഇല്ല");
    let idx=(d.currentBowlerIndex||0)+1;
    if(idx>=order.length)idx=0;
    const nb=order[idx];
    gameRef.update({bowler:nb,currentBowlerIndex:idx,phase:"select",currentQ:null});
    gameRef.child("players/"+d.bowler+"/role").set("bowling");
    gameRef.child("players/"+nb+"/role").set("bowler");
  });
}

function bowlerSelectQuestion(){
  const idx=parseInt(document.getElementById('qSelect').value);
  if(isNaN(idx))return alert("ചോദ്യം തിരഞ്ഞെടുക്കുക");
  const q=questions[idx];
  speak(q.q);
  gameRef.once("value",snap=>{
    const d=snap.val();
    const qt=getQuestionType(d.over||0);
    gameRef.update({currentQ:idx,qTime:qt.time,phase:"bowlerAnswer",qType:qt.type});
  });
  document.getElementById('bowlerAnswerArea').classList.remove('hidden');
  document.getElementById('bowlerQText').textContent=q.q;
  const opts=document.getElementById('bowlerOptions');
  opts.innerHTML="";
  if(q.type==="mcq"){
    q.o.forEach((o,i)=>{
      const div=document.createElement('div');
      div.className='option';div.textContent=o;div.dataset.i=i;
      div.onclick=()=>{opts.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));div.classList.add('selected');};
      opts.appendChild(div);
    });
  }else{
    opts.innerHTML="<p class='small'>ടെക്സ്റ്റ് ഉത്തരം — ബൗളർ ശരി/തെറ്റ് തീരുമാനിക്കും</p>";
  }
}

function bowlerSubmitAnswer(){
  gameRef.once("value",snap=>{
    const d=snap.val();
    const q=questions[d.currentQ];
    if(q.type==="mcq"){
      const sel=document.querySelector('#bowlerOptions .option.selected');
      if(!sel)return alert("ഉത്തരം തിരഞ്ഞെടുക്കുക");
      if(parseInt(sel.dataset.i)===q.a){
        gameRef.update({phase:"bowl"});
        document.getElementById('bowlerAnswerArea').classList.add('hidden');
      }else{
        gameRef.update({extras:(d.extras||0)+1,phase:"select",currentQ:null});
        alert("നോ ബോൾ! 1 എക്സ്ട്രാ.");
      }
    }else{
      gameRef.update({phase:"bowl"});
      document.getElementById('bowlerAnswerArea').classList.add('hidden');
    }
  });
}

function loadBatsmanQuestion(d){
  if(d.currentQ===null||d.phase!=="bowl")return;
  const q=questions[d.currentQ];
  const qt=getQuestionType(d.over||0);
  document.getElementById('question').textContent=q.q;
  const opts=document.getElementById('options');
  const ta=document.getElementById('textAnswer');
  const sb=document.getElementById('submitText');
  opts.innerHTML="";
  if(qt.type==="mcq"){
    ta.classList.add('hidden');sb.classList.add('hidden');
    q.o.forEach((o,i)=>{
      const div=document.createElement('div');
      div.className='option';div.textContent=o;
      div.onclick=()=>batsmanAnswer(i,d.currentQ);
      opts.appendChild(div);
    });
  }else{
    ta.classList.remove('hidden');sb.classList.remove('hidden');
    ta.value="";
  }
  document.getElementById('questionCard').classList.remove('hidden');
  startTimer(qt.time);
}

function showSpectator(d){
  if(d.currentQ===null)return;
  const q=questions[d.currentQ];
  document.getElementById('specInfo').innerHTML="<b>ചോദ്യം:</b> "+q.q;
  document.getElementById('spectatorView').classList.remove('hidden');
}

function startTimer(sec){
  clearInterval(timerInterval);
  let t=sec;
  document.getElementById('timer').textContent=t;
  startTime=Date.now();
  timerInterval=setInterval(()=>{
    t--;
    document.getElementById('timer').textContent=Math.max(0,t);
    if(t<=0)clearInterval(timerInterval);
  },1000);
}

function batsmanAnswer(choice,qIdx){
  clearInterval(timerInterval);
  const timeTaken=(Date.now()-startTime)/1000;
  processAnswer(choice,qIdx,timeTaken,null);
}

function submitTextAnswer(){
  clearInterval(timerInterval);
  const timeTaken=(Date.now()-startTime)/1000;
  const text=document.getElementById('textAnswer').value.trim();
  processAnswer(null,null,timeTaken,text);
}

function processAnswer(choice,qIdx,timeTaken,text){
  gameRef.once("value",snap=>{
    const d=snap.val();
    const qt=getQuestionType(d.over||0);
    let runs=0,wicket=false;
    if(choice!==null){
      const correct=questions[qIdx].a;
      if(choice===correct){
        runs=calcRuns(timeTaken,qt.time);
        if(runs===0)wicket=true;
      }else wicket=true;
    }else{
      runs=calcRuns(timeTech,qt.time);
      if(runs===0)wicket=true;
    }
    const newScore=(d.score||0)+runs;
    const newWickets=(d.wickets||0)+(wicket?1:0);
    let newBall=(d.ball||0)+1,newOver=d.over||0;
    let rotate=false;
    if(runs===1||runs===3)rotate=true;
    if(newBall>=6){newBall=0;newOver++;rotate=true;}
    const used=[...(d.used||[]),qIdx].filter(x=>x!==null);
    const lastBalls=[...(d.lastBalls||[]),wicket?"W":runs];
    let updates={score:newScore,wickets:newWickets,ball:newBall,over:newOver,used:used,phase:"select",currentQ:null,lastBalls:lastBalls};
    if(d.striker){
      updates[`players/${d.striker}/runs`]=(d.players?.[d.striker]?.runs||0)+runs;
      updates[`players/${d.striker}/balls`]=(d.players?.[d.striker]?.balls||0)+1;
    }
    if(wicket)updates[`players/${d.striker}/role`]="out";
    if(rotate&&d.nonstriker&&!wicket){
      updates.striker=d.nonstriker;
      updates.nonstriker=d.striker;
      updates[`players/${d.striker}/role`]="nonstriker";
      updates[`players/${d.nonstriker}/role`]="striker";
    }
    const maxW=(d.battingCount||2);
    if(newWickets>=maxW||newOver>=20){
      if(d.innings===1){
        updates.innings=2;
        updates.score=0;updates.wickets=0;updates.ball=0;updates.over=0;
        updates.target=newScore+(d.extras||0)+1;
        updates.status="playing";
      }else{
        updates.status="finished";
      }
    }
    if(d.innings===2&&d.target&&newScore+(d.extras||0)>=d.target){
      updates.status="finished";
    }
    gameRef.update(updates);
    showResult(runs,wicket,timeTaken);
  });
}

function showResult(runs,wicket,time){
  const res=document.getElementById('result');
  res.classList.remove('hidden');
  res.innerHTML=wicket?"<h2 style='color:#ef4444'>വിക്കറ്റ്!</h2><p>"+time.toFixed(1)+"s</p>":"<h2 style='color:#22c55e'>"+runs+" റൺസ്!</h2><p>"+time.toFixed(1)+"s</p>";
  setTimeout(()=>res.classList.add('hidden'),2500);
}

function showSummary(d){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('summary').classList.remove('hidden');
  const total=(d.score||0)+(d.extras||0);
  let html="<p>ഫൈനൽ സ്കോർ: <b>"+total+"/"+d.wickets+"</b></p>";
  let motm="",maxR=0;
  Object.entries(d.players||{}).forEach(([id,p])=>{
    if((p.runs||0)>maxR){maxR=p.runs;motm=p.name;}
  });
  html+="<p>മാൻ ഓഫ് ദ മാച്ച്: <b>"+motm+"</b> ("+maxR+" റൺസ്)</p>";
  document.getElementById('summaryContent').innerHTML=html;
}
